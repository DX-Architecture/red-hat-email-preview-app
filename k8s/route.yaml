apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: email-preview-dashboard
  namespace: email-preview
  labels:
    app: email-preview-app
  annotations:
    description: Internal Streamlit dashboard for Red Hat Email Preview
spec:
  to:
    kind: Service
    name: email-preview-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
